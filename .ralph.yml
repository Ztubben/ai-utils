# Ralph Loop superproject config (schema/ralph.schema.json, ADR-0001).
# Here ai-utils is the checkout root and so is its own target repository
# (ADR-0001 amendment): the loop dogfoods its own tooling.
version: 1

branching:
  # Ralph integrates into develop; promoting develop -> master (squash) is
  # human-owned. Ralph never touches the default branch directly.
  base: develop

gating:
  - name: test
    run: test/run.sh

# ai-utils is its own target repository here (ADR-0001 amendment), so it commits
# its own catalog. These are an instance of the shipped contract, never defaults
# inherited by a repository that mounts ai-utils as a submodule.
models:
  profiles:
    - key: claude-opus
      provider: claude
      model: claude-opus-5
    - key: codex-high
      provider: codex
      model: gpt-5-codex
  defaults:
    implementation: claude-opus
    review: codex-high

notify:
  github: Ztubben
