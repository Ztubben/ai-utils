# Ralph Loop superproject config (schema/ralph.schema.json, ADR-0001).
# Here ai-utils is the checkout root and so is its own target repository
# (ADR-0001 amendment): the loop dogfoods its own tooling.
version: 1

branching:
  # Ralph integrates into main and may auto-merge there; there is no promotion
  # step. A superproject's submodule pointer bump is the release (ADR-0007).
  base: main

gating:
  - name: test
    run: test/run.sh

# ai-utils is its own target repository here (ADR-0001 amendment), so it commits
# its own catalog. These are an instance of the shipped contract, never defaults
# inherited by a repository that mounts ai-utils as a submodule.
models:
  profiles:
    - key: claude-opus
      provider: claude
      model: opus
    - key: codex-sol
      provider: codex
      model: sol
  defaults:
    implementation: claude-opus
    review: codex-sol

# ai-utils is its own target repository here, so its control plane is its own
# review machinery: a Story touching any of this needs a human Approve before it
# merges, whatever its type. The mechanism must not approve changes to itself.
control_plane:
  protected:
    - .github/workflows/**
    - prompts/**
    - schema/**
    - lib/ralph_review*.py
    - docs/review-contract.md
    - bin/ralph
    - bin/ralph.sh
    - .ralph.yml

notify:
  github: Ztubben
